name: Molan

options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

targets:
  Molan:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - path: Molan
      - path: SharedAppGroup
    info:
      path: Molan/Resources/Info.plist
      properties:
        CFBundleDisplayName: 墨览
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.molan.reader.inbox
            CFBundleURLSchemes:
              - molan
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: 墨览文档
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - public.json
              - net.daringfireball.markdown
    preBuildScripts:
      - name: Build KMP shared framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping duplicate Kotlin framework build"
            exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    dependencies:
      - framework: "../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/MolanShared.framework"
        embed: false
      - target: MolanShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.molan.reader
        PRODUCT_NAME: Molan
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Molan/Molan.entitlements
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    scheme:
      gatherCoverageData: true
      testTargets:
        - MolanTests
        - MolanUITests

  MolanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MolanTests
    dependencies:
      - target: Molan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.molan.reader.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Molan.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Molan"
        BUNDLE_LOADER: "$(TEST_HOST)"

  MolanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MolanUITests
    dependencies:
      - target: Molan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.molan.reader.uitests
        GENERATE_INFOPLIST_FILE: YES

  MolanShare:
    type: app-extension
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - path: ShareExtension
      - path: SharedAppGroup
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: 收集到墨览
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.molan.reader.share
        PRODUCT_NAME: MolanShare
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        SKIP_INSTALL: YES
