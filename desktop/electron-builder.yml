appId: com.mdreader.desktop
productName: MD阅读器
copyright: Copyright © 2026
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/pandoc.exe
    to: pandoc.exe
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: MD阅读器
# 微软商店上架时改用 msix target：
# win.target: [{ target: msix, arch: [x64] }]
